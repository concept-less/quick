# Only trusted main can ever reach cloud. PRs/forks/tags never schedule this workflow.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch / minor / major / explicit X.Y.Z (must exceed all tags)'
        default: patch
        required: true
permissions:
  contents: read
# Shared by automatic pushes, manual dispatches and retries. Never cancel a build in flight.
# GitHub keeps at most one pending run, coalescing bursts; prepare fetches latest main under lock.
concurrency:
  group: quick-release-main
  cancel-in-progress: false
jobs:
  cloud:
    if: github.repository == 'concept-less/quick' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, x64, quick-release-cloud]
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      skip: ${{ steps.prepare.outputs.skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Test, reserve version, build core and extensions, create draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: node scripts/auto-release.mjs prepare
  macos:
    needs: cloud
    if: needs.cloud.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      TAG: ${{ needs.cloud.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.cloud.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install and check Electron
        working-directory: electron
        run: npm ci && npm run check
      - name: Build dmg + zip (ad-hoc signed, not notarized)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --publish never -c.publish.provider=github -c.publish.owner=concept-less -c.publish.repo=quick
      - name: Upload desktop assets to draft
        working-directory: electron/dist
        run: gh release upload "$TAG" ./*.dmg ./*-mac.zip --clobber -R "$GITHUB_REPOSITORY"
      - name: Verify every asset, provenance and checksum, then publish
        run: node scripts/auto-release.mjs finalize
  attention:
    needs: [cloud, macos]
    if: always() && github.repository == 'concept-less/quick' && github.ref == 'refs/heads/main' && (needs.cloud.result == 'failure' || needs.macos.result == 'failure' || needs.cloud.result == 'cancelled' || needs.macos.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, quick-release-cloud]
    timeout-minutes: 5
    permissions: {}
    steps:
      # Installed outside the checkout. Has local hub auth, never a GitHub secret.
      - name: Route failure to quick-agent attention (deduplicated per run)
        run: node /home/simon/.local/share/quick-release-runner/ops/notify.mjs "$GITHUB_RUN_ID"
