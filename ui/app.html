<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quick-agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23e61919'/></svg>">
<style>
/* ============================================================
   quick-agent · design tokens (minimal brutalism)
   paper/ink + ONE accent (signal red). Square corners, hairline
   grid, mono micro-labels, no gradients, no soft shadows.
   ============================================================ */
:root{
  --bg:#f4f4f0;--bg-2:#ebebe6;--bg-3:#e1e1db;--surface:#fbfbf9;
  --fg:#0d0d0d;--fg-2:#55554f;--fg-3:#8c8c85;
  --line:#d4d4cc;--line-2:#0d0d0d;
  --acc:#e61919;--acc-fg:#ffffff;--acc-soft:rgba(230,25,25,.08);
  --inv-bg:#0d0d0d;--inv-fg:#f4f4f0;
  --term-bg:#0d0d0d;--term-fg:#d9d9d2;
  --hard-c:var(--line-2);--hard:4px 4px 0 var(--hard-c);
  --sans:"Inter","Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r:0px;--bw:1px;
  --t:.12s cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0e0e0e;--bg-2:#161616;--bg-3:#1f1f1f;--surface:#121212;
  --fg:#ececE6;--fg-2:#a3a39c;--fg-3:#6b6b66;
  --line:#2a2a2a;--line-2:#ececE6;
  --acc:#ff3b30;--acc-fg:#0e0e0e;--acc-soft:rgba(255,59,48,.12);
  --inv-bg:#ececE6;--inv-fg:#0e0e0e;
  --term-bg:#000;--term-fg:#cfcfc8;--hard-c:#4a4a46;
  color-scheme:dark;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition:none!important}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.65 var(--sans);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--fg-3);text-underline-offset:2px}a:hover{text-decoration-color:var(--acc);color:var(--acc)}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
::selection{background:var(--fg);color:var(--bg)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border:3px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--fg-3)}::-webkit-scrollbar-track{background:transparent}
.lbl{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
kbd{font:500 10.5px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;padding:1px 4px;color:var(--fg-2);background:var(--surface)}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3) 0 0;border-bottom:var(--bw) solid var(--line-2);background:var(--bg);flex:0 0 auto;height:48px}
.brand{display:flex;align-items:center;gap:10px;height:100%;padding:0 var(--s4);border-right:var(--bw) solid var(--line-2);white-space:nowrap;font:800 14px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase}
.brand .mk{width:14px;height:14px;background:var(--acc);display:inline-block}
.brand small{font:500 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--fg-3)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;border:var(--bw) solid var(--line);border-radius:var(--r);background:transparent;cursor:pointer;white-space:nowrap;font-size:13px;transition:background var(--t),border-color var(--t),color var(--t);text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--line-2);text-decoration:none;color:var(--fg)}
.btn:active{transform:translate(1px,1px)}
.btn.primary{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg);font-weight:600}.btn.primary:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn.danger:hover{border-color:var(--acc);color:var(--acc)}
.btn.icon{padding:0;width:30px}
.btn:disabled{opacity:.4;cursor:default;transform:none}.btn:disabled:hover{border-color:var(--line);background:transparent;color:var(--fg)}
.btn.primary:disabled:hover{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
select.btn{padding:0 6px 0 8px;max-width:200px;font:12px var(--mono);appearance:auto;background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font:11px/1 var(--mono);color:var(--fg-2);white-space:nowrap}
.dot{width:7px;height:7px;background:var(--fg-3);display:inline-block;flex:0 0 auto}
.dot.on{background:var(--fg)}.dot.off{background:var(--acc)}.dot.warn{background:var(--acc)}
.dot.live{background:var(--acc);animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
/* ============================================================
   attention-first layout (docs/attention.md)
   left: 注意力 (需要你 / 进行中 / 已完成待扫)   right: 交接台
   Calm: the accent colour is reserved for "something is waiting
   for you"; everything in flight lives in the periphery.
   ============================================================ */
#main{flex:1;display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);min-height:0}
#attn{min-width:0;border-right:var(--bw) solid var(--line-2);background:var(--bg);display:flex;flex-direction:column;min-height:0;position:relative}
#desk{display:flex;flex-direction:column;min-width:0;min-height:0}
#mobtabs{display:none}
@media (max-width:1100px){#main{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}}
@media (max-width:900px){
  #main{grid-template-columns:minmax(0,1fr)}#attn{border-right:0}#desk{display:none}
  body.show-desk #desk{display:flex}body.show-desk #attn{display:none}
  #mobtabs{display:flex}.hide-m{display:none!important}
  .brand{padding:0 var(--s3)}#cwd{display:none}
}
@media (max-width:600px){.brand .bt{display:none}header{gap:6px;padding-right:var(--s2)}.box .hint{display:none}#summary{display:none}}
/* header summary: the one number that matters */
#summary{font:12px/1 var(--mono);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:var(--s2)}
#summary b{color:var(--fg);font-weight:700}
#summary .calm{color:var(--fg-3)}
.btn.toggle[aria-pressed=true]{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.menu{position:absolute;right:var(--s3);top:44px;z-index:30;background:var(--bg);border:var(--bw) solid var(--line-2);box-shadow:var(--hard);min-width:260px;display:none;flex-direction:column}
.menu.on{display:flex}
.menu .mi{display:flex;align-items:center;gap:10px;padding:10px 14px;border:0;border-bottom:var(--bw) solid var(--line);background:none;text-align:left;cursor:pointer;font-size:13px;color:var(--fg);text-decoration:none}
.menu .mi:last-child{border-bottom:0}
.menu .mi:hover{background:var(--bg-2);color:var(--fg)}
.menu .mi .lbl{min-width:44px}
.menu select{flex:1;min-width:0;height:28px;border:var(--bw) solid var(--line);background:var(--bg);font:12px var(--mono);color:var(--fg)}
/* ---------- attention board ---------- */
.sec{border-bottom:var(--bw) solid var(--line-2)}
.sh{display:flex;align-items:center;gap:8px;height:40px;padding:0 var(--s3) 0 var(--s4);position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:var(--bw) solid var(--line)}
.sh .lbl{color:var(--fg)}
.sh .n{font:600 11px/1 var(--mono);color:var(--fg-2)}
.sh .mk{width:8px;height:8px;background:var(--fg-3);flex:0 0 auto}
.sec.need.has .sh .mk{background:var(--acc)}
.sh .act{border:0;background:none;cursor:pointer;font:500 11px/1 var(--mono);color:var(--fg-2);padding:6px 4px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sh .act:hover{color:var(--fg);text-decoration-color:var(--fg)}
.sh .act:disabled{display:none}
.sec.flight .sh .lbl,.sec.skim .sh .lbl{color:var(--fg-2)}
.calmnote{padding:18px var(--s4) 20px;color:var(--fg-3);font-size:13px;line-height:1.7}
.calmnote b{color:var(--fg-2);font-weight:600}
.hl{animation:hl 1.2s ease-out}
@keyframes hl{from{background:var(--acc-soft)}}
/* needs-you cards */
.ncard{padding:14px var(--s3) 12px var(--s4);border-bottom:var(--bw) solid var(--line);position:relative;transition:background var(--t)}
.ncard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.ncard.fresh::before{background:var(--fg)}
.ncard.urgent::before{background:var(--acc)}
.ncard .nh{display:flex;align-items:center;gap:8px;min-width:0}
.ncard .kind{font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--fg)}
.ncard.urgent .kind{color:var(--acc)}
.ncard .nt{font-weight:700;font-size:14px;margin:6px 0 2px;line-height:1.4;cursor:pointer;word-break:break-word}
.ncard .nt:hover{text-decoration:underline;text-underline-offset:3px}
.ncard .nx{font-size:13px;color:var(--fg-2);max-height:6.2em;overflow:hidden;position:relative;line-height:1.55}
.ncard .nx.open{max-height:none}
.ncard .nx:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.6em;background:linear-gradient(transparent,var(--bg))}
.ncard .nx.short::after{display:none}
.ncard .nx p{margin:.2em 0}.ncard .nx pre{max-height:none}
.ncard .reply{margin-top:10px;display:flex;flex-direction:column;border:var(--bw) solid var(--line);background:var(--surface);transition:border-color var(--t)}
.ncard .reply:focus-within{border-color:var(--line-2)}
.ncard .reply textarea{border:0;outline:0;resize:none;background:transparent;padding:8px 10px;min-height:36px;max-height:180px;font-size:13px;line-height:1.5;width:100%}
.ncard .na{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.ncard .na .btn{height:26px;padding:0 10px;font-size:12px}
.ncard .na .quiet{border-color:transparent;color:var(--fg-3)}
.ncard .na .quiet:hover{border-color:var(--line);color:var(--fg)}
.ncard img{max-width:100%;max-height:120px;border:var(--bw) solid var(--line);margin-top:8px;cursor:zoom-in}
#snoozed{font:11px/1 var(--mono);color:var(--fg-3)}
/* in flight: periphery */
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:9px var(--s3) 9px var(--s4);border-bottom:var(--bw) solid var(--line);cursor:pointer;color:var(--fg-2);transition:background var(--t),color var(--t)}
.frow:hover{background:var(--bg-2);color:var(--fg)}
.frow .ft{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fa{grid-column:2/4;font:11.5px/1.4 var(--mono);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{width:6px;height:6px;background:var(--fg-3);animation:pulse 1.6s steps(2,start) infinite}
/* skim */
.srow{border-bottom:var(--bw) solid var(--line)}
.srow>.sm{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:3px 10px;padding:10px var(--s3) 10px var(--s4);cursor:pointer;transition:background var(--t)}
.srow>.sm:hover{background:var(--bg-2)}
.srow .ck{font:600 12px/1 var(--mono);color:var(--fg-3)}
.srow .ft{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .fa{grid-column:2/5;font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sx{display:none;padding:0 var(--s3) 12px var(--s4)}
.srow.open .sx{display:block}
.srow.open .fa{display:none}
.srow .sx .md{font-size:13px;border-left:3px solid var(--fg);padding:2px 0 2px 12px;max-height:340px;overflow:auto}
.srow .sx .na{display:flex;gap:6px;margin-top:10px}
.srow .sx .na .btn{height:26px;padding:0 10px;font-size:12px}
#held{padding:10px var(--s4);font-size:12.5px;color:var(--fg-2);border-bottom:var(--bw) solid var(--line);background:var(--bg-2);display:none}
#held.on{display:block}
#held button{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--fg);font-size:12.5px}
.afoot{padding:14px var(--s4) 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font:11.5px/1.6 var(--mono);color:var(--fg-3)}
.afoot button{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:var(--fg-2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.afoot button:hover{color:var(--fg);text-decoration-color:var(--fg)}
#machines{display:flex;gap:6px 12px;flex-wrap:wrap}#machines>span{display:inline-flex;align-items:center;gap:5px}
/* drawers (回顾 / 浏览器评论) and task detail share the attention column */
.layer{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
.layer.on{display:flex;animation:slin .16s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(-8px)}}
#detail{z-index:6}
.lh{height:48px;display:flex;align-items:center;gap:10px;padding:0 var(--s3);border-bottom:var(--bw) solid var(--line-2);flex:0 0 auto}
.lh .lbl{color:var(--fg)}
.hfilter{display:flex;gap:0;border-bottom:var(--bw) solid var(--line);height:34px;flex:0 0 auto}
.hfilter button{border:0;border-right:var(--bw) solid var(--line);background:none;padding:0 14px;cursor:pointer;font-size:12px;color:var(--fg-3)}
.hfilter button.on{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg)}
/* ---------- desk (hand-off) ---------- */
.deskhead{display:flex;align-items:center;gap:10px;height:40px;padding:0 var(--s4);border-bottom:var(--bw) solid var(--line);flex:0 0 auto}
.deskhead .lbl{color:var(--fg)}
#older{border:0;background:none;cursor:pointer;font:11px/1 var(--mono);color:var(--fg-3);text-decoration:underline;text-underline-offset:3px;display:block;margin:0 auto var(--s4)}
#older:hover{color:var(--fg)}
.receipt{border:var(--bw) solid var(--line-2);border-left:4px solid var(--fg);background:var(--surface);padding:10px 14px;margin:var(--s2) 0}
.receipt .rh{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--fg-2);flex-wrap:wrap}
.receipt .rt{font-weight:700;margin:6px 0 2px;cursor:pointer}
.receipt .rt:hover{text-decoration:underline;text-underline-offset:3px}
.receipt .rm{font:11.5px/1.6 var(--mono);color:var(--fg-3);word-break:break-all}
.receipt .rn{font-size:12px;color:var(--fg-3);margin-top:4px}
.receipt details>summary{cursor:pointer;list-style:none;font:500 10.5px/1.8 var(--mono);color:var(--fg-3);letter-spacing:.08em;margin-top:4px}
.receipt details>summary::-webkit-details-marker{display:none}
.receipt details pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg-2);border:var(--bw) solid var(--line);padding:8px 10px;max-height:260px;overflow:auto;margin:6px 0 0}
.rline{display:flex;align-items:center;gap:8px;font:11.5px/1.6 var(--mono);color:var(--fg-3);margin:var(--s2) 0;cursor:pointer}
.rline::before,.rline::after{content:"";flex:1;border-top:var(--bw) dashed var(--line)}
.rline:hover{color:var(--fg)}
/* footer machines: plain text, no panel */
.afoot #machines{background:none;padding:0;border:0;font:inherit}
#ticker{color:var(--fg-3);transition:opacity .6s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
#ticker.fade{opacity:0}
.ok-btn{border:var(--bw) solid var(--line);background:transparent;height:24px;padding:0 9px;font:500 11.5px/1 var(--sans);color:var(--fg-2);cursor:pointer;transition:border-color var(--t),color var(--t),background var(--t)}
.ok-btn:hover{border-color:var(--line-2);color:var(--fg)}
.srow.open .ok-btn{display:none}

/* ---------- chat ---------- */
#log{flex:1;overflow-y:auto;padding:var(--s6) 0 var(--s3)}
.col{max-width:780px;margin:0 auto;padding:0 var(--s5)}
@media (max-width:600px){.col{padding:0 var(--s3)}}
.msg{margin:0 0 var(--s5);display:flex;flex-direction:column;animation:fin .16s ease-out}
.msg:empty{display:none}
/* consecutive tool-only turns read as one continuous log */
.msg.assistant:has(>.asst>.tool:last-child){margin-bottom:0}
.msg.assistant:has(>.asst>.tool:last-child)~.msg.assistant>.asst>.tool:first-child{margin-top:-1px}
.msg.assistant:has(>.asst>.tool:last-child)+.msg.assistant>.asst>.md:first-child,.msg.assistant:has(>.asst>.tool:last-child)~.msg.toolResult+.msg.assistant>.asst>.md:first-child,.msg.assistant:has(>.asst>.tool:last-child)~.msg.toolResult+.msg.assistant>.asst>.think:first-child{margin-top:var(--s3)}
.msg.assistant:has(>.asst>.tool:last-child)+.msg:not(.assistant):not(.toolResult),.msg.assistant:has(>.asst>.tool:last-child)~.msg.toolResult+.msg:not(.assistant):not(.toolResult){margin-top:var(--s5)}
@keyframes fin{from{opacity:0;transform:translateY(3px)}}
.msg.user{align-items:flex-end}
.bubble{max-width:82%;padding:10px 14px;background:var(--bg-2);border:var(--bw) solid var(--line);white-space:pre-wrap;word-break:break-word}
.bubble img{max-width:220px;max-height:160px;display:block;margin-top:8px;border:var(--bw) solid var(--line)}
.asst{max-width:100%;word-break:break-word}
.md{line-height:1.75}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.5em 0}.md ul,.md ol{margin:.5em 0;padding-left:1.5em}.md li{margin:.15em 0}.md li::marker{color:var(--fg-3)}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .4em;line-height:1.25;letter-spacing:-.01em;font-weight:700}.md h1{font-size:1.35em}.md h2{font-size:1.18em}.md h3{font-size:1.05em}.md h4{font-size:1em}
.md code{background:var(--bg-2);padding:1px 5px;border:var(--bw) solid var(--line);font-size:.86em}
.md pre{background:var(--surface);border:var(--bw) solid var(--line);padding:12px 14px;overflow-x:auto;margin:0;line-height:1.55}
.md pre code{background:none;border:0;padding:0;font-size:12.5px}
.code{margin:.7em 0;border:var(--bw) solid var(--line)}
.code pre{border:0}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 12px;height:28px;border-bottom:var(--bw) solid var(--line);background:var(--bg-2)}
.copy{border:0;background:none;cursor:pointer;font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:6px 8px}.copy:hover{color:var(--fg)}
.md blockquote{margin:.6em 0;padding:2px 14px;border-left:3px solid var(--fg);color:var(--fg-2)}
.md table{border-collapse:collapse;margin:.7em 0;font-size:13px;display:block;overflow-x:auto}.md td,.md th{border:var(--bw) solid var(--line);padding:5px 10px;text-align:left}.md th{background:var(--bg-2);font-weight:600}
.md a{word-break:break-all}
.md hr{border:0;border-top:var(--bw) solid var(--line);margin:1em 0}
.tid{font:500 11.5px/1 var(--mono);padding:2px 5px;border:var(--bw) solid var(--fg);color:var(--fg);cursor:pointer;white-space:nowrap;display:inline-block;vertical-align:1px;transition:background var(--t),color var(--t)}
.tid:hover{background:var(--fg);color:var(--bg)}
.think{margin:var(--s1) 0 var(--s2);color:var(--fg-2);font-size:13px}
.think summary{cursor:pointer;list-style:none;user-select:none;display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1.8 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"+";display:inline-block;width:10px}.think[open] summary::before{content:"−"}
.think summary:hover{color:var(--fg)}
.think .body{white-space:pre-wrap;border-left:var(--bw) solid var(--line);padding:2px 12px;margin:6px 0 6px 4px;max-height:320px;overflow:auto}
/* tool calls: compact log rows */
.tool{border:var(--bw) solid var(--line);background:transparent;margin:0;overflow:hidden;transition:border-color var(--t)}
.tool+.tool{border-top:0}
.md+.tool,.think+.tool{margin-top:var(--s3)}
.tool:has(+.md){margin-bottom:var(--s3)}
.tool>summary{display:flex;align-items:center;gap:10px;padding:0 12px;height:34px;cursor:pointer;list-style:none;user-select:none;font-size:12.5px}
.tool>summary:hover{background:var(--bg-2)}
.tool>summary::-webkit-details-marker{display:none}
.tool[open]{border-color:var(--line-2)}
.tool[open]>summary{border-bottom:var(--bw) solid var(--line)}
.tool .tname{font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;flex:0 0 auto;min-width:56px}
.tool .targs{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font:12px var(--mono)}
.tool .tres{padding:10px 12px;background:var(--surface);max-height:360px;overflow:auto}
.tool .tres+.tres{border-top:var(--bw) solid var(--line)}
.tool .tres b{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);display:block;margin-bottom:6px}
.tool .tres pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.55}
.tool.dispatch{border-color:var(--line-2);border-width:var(--bw) var(--bw) var(--bw) 3px;border-left-color:var(--acc)}
.tool.dispatch+.tool{border-top:var(--bw) solid var(--line)}
.tool.dispatch .tname{color:var(--acc)}
.tool.err{border-left:3px solid var(--acc)}
.tool .ok{font:600 12px var(--mono);color:var(--fg-3)}.tool .ko{font:600 12px var(--mono);color:var(--acc)}
.spin{width:8px;height:8px;background:var(--fg);flex:0 0 auto;animation:pulse 1s steps(2,start) infinite}
@keyframes pulse{to{opacity:.15}}
.ico{width:14px;text-align:center;flex:0 0 auto;font:600 12px/1 var(--mono);color:var(--fg-3)}
.card{border:var(--bw) solid var(--line-2);background:var(--surface);padding:12px 16px;max-width:100%;align-self:stretch}
.card .chead{display:flex;align-items:center;gap:8px;font:11px/1.6 var(--mono);color:var(--fg-2);margin-bottom:6px;flex-wrap:wrap}
.card .chead b{font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;color:var(--fg)}
.card .ttl{font-weight:700;margin-bottom:4px;letter-spacing:-.005em}
.card.report{border-left-width:4px}
.card.report.done{border-left-color:var(--fg)}
.card.report.needs_input,.card.report.blocked,.card.report.idle,.card.report.failed,.card.report.exited,.card.report.cancelled{border-left-color:var(--acc)}
.card.comment{border-style:dashed;border-left:4px solid var(--fg)}
.card .ctext{white-space:pre-wrap;word-break:break-word;font-size:13.5px;max-height:260px;overflow:auto}
.card .ctext.md{white-space:normal}
.card details>summary{cursor:pointer;list-style:none;margin:6px 0 0}
.card details>summary::-webkit-details-marker{display:none}
.card img{max-width:260px;max-height:180px;margin:8px 8px 0 0;border:var(--bw) solid var(--line);cursor:zoom-in}
.note{text-align:center;margin:var(--s4) 0;font:500 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);display:flex;align-items:center;gap:12px}
.note::before,.note::after{content:"";flex:1;border-top:var(--bw) solid var(--line)}
.errline{color:var(--acc);border:var(--bw) solid var(--acc);background:var(--acc-soft);padding:8px 12px;font-size:13px;margin:6px 0;white-space:pre-wrap}
.typing{display:flex;gap:5px;padding:8px 0}.typing i{width:7px;height:7px;background:var(--fg);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.15}40%{opacity:1}}
.empty{margin:12vh 0 0;max-width:560px}
.empty .lbl{display:block;margin-bottom:var(--s4)}
.empty h2{color:var(--fg);font:800 clamp(30px,5vw,44px)/1 var(--sans);letter-spacing:-.04em;margin:0 0 var(--s4);text-transform:uppercase}
.empty h2 em{font-style:normal;color:var(--acc)}
.empty p{color:var(--fg-2);margin:0;max-width:460px}
.sugg{display:grid;grid-template-columns:1fr;margin-top:var(--s6);border-top:var(--bw) solid var(--line-2)}
.sugg button{display:flex;align-items:center;gap:12px;border:0;border-bottom:var(--bw) solid var(--line);background:none;padding:12px 2px;cursor:pointer;font-size:13.5px;text-align:left;transition:padding var(--t),color var(--t)}
.sugg button::before{content:attr(data-n);font:500 10.5px/1 var(--mono);color:var(--fg-3);width:22px}
.sugg button::after{content:"→";margin-left:auto;color:var(--fg-3);font-family:var(--mono)}
.sugg button:hover{padding-left:8px}.sugg button:hover::after{color:var(--acc)}
/* ---------- composer ---------- */
#composer{flex:0 0 auto;padding:var(--s2) 0 var(--s4)}
#statusline{font:11px/1 var(--mono);color:var(--fg-2);display:flex;gap:14px;align-items:center;min-height:22px;padding:0 0 8px;flex-wrap:wrap}
#statusline #conn{display:inline-flex;align-items:center;gap:6px}
#queue{color:var(--acc)}
.box{border:var(--bw) solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;transition:box-shadow var(--t)}
.box:focus-within{box-shadow:var(--hard)}
.box textarea{border:0;outline:0;resize:none;background:transparent;min-height:26px;max-height:260px;line-height:1.6;padding:12px 14px 4px;width:100%;font-size:14.5px}
.box textarea::placeholder{color:var(--fg-3)}
.box .row{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
.box .hint{font:11px/1.3 var(--mono);color:var(--fg-3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sendBtn{min-width:76px}
#sendBtn.busy::before{content:"";width:7px;height:7px;background:currentColor;animation:pulse .6s steps(2,start) infinite}
#thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 0}#thumbs:empty{display:none}
#thumbs div{position:relative}#thumbs img{height:56px;border:var(--bw) solid var(--line);display:block}
#thumbs b{position:absolute;top:-7px;right:-7px;background:var(--fg);color:var(--bg);width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;cursor:pointer}
/* ---------- side panel ---------- */
#machines{font:11px/1.4 var(--mono);color:var(--fg-2);display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px var(--s3);border-bottom:var(--bw) solid var(--line);background:var(--bg-2)}
#machines>span{display:inline-flex;align-items:center;gap:6px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.titem{min-width:0;overflow:hidden;padding:12px var(--s3) 12px var(--s4);border-bottom:var(--bw) solid var(--line);cursor:pointer;position:relative;transition:background var(--t)}
.titem:hover{background:var(--bg-2)}
.titem.sel{background:var(--bg-3)}
.titem.sel::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--fg)}
.titem:focus-visible{outline-offset:-2px}
.trow{display:flex;align-items:center;gap:8px;min-width:0}
.trow+.trow{margin-top:4px}
.ttitle{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.tsub{font-size:12px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tago{font-size:11px;line-height:1;color:var(--fg-3);flex:0 0 auto}
.tidm{font:11px/1 var(--mono);color:var(--fg-3);flex:0 0 auto}
/* status tag: glyph + label, encoded by fill rather than hue */
.st{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--mono);letter-spacing:.06em;padding:0 6px;height:19px;border:var(--bw) solid var(--line);color:var(--fg-2);white-space:nowrap;flex:0 0 auto;background:transparent}
.st::before{content:"";width:6px;height:6px;background:currentColor;flex:0 0 auto}
.st.running,.st.starting,.st.claimed{color:var(--fg);border-color:var(--fg)}
.st.running::before,.st.starting::before,.st.claimed::before{animation:pulse 1s steps(2,start) infinite}
.st.done,.st.dispatched{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-fg)}
.st.needs_input,.st.idle,.st.blocked,.st.pending{border-color:var(--acc);color:var(--acc)}
.st.failed,.st.exited{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.st.cancelled,.st.dismissed{color:var(--fg-3);border-style:dashed;text-decoration:line-through}
.st.cancelled::before,.st.dismissed::before{display:none}
.mach{font:11px/1 var(--mono);color:var(--fg-2);flex:0 0 auto}
.blank{padding:48px 24px;color:var(--fg-2);text-align:center;font-size:13px;line-height:1.8}
.blank .lbl{display:block;margin-bottom:10px}
.skel{padding:14px var(--s4);border-bottom:var(--bw) solid var(--line)}
.skel i{display:block;height:10px;background:var(--bg-3);margin:4px 0;animation:pulse 1.2s ease-in-out infinite alternate}
.skel i+i{width:60%;height:8px;margin-top:10px}
/* ---------- task detail ---------- */
#detail{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#detail.on{display:flex;animation:slin .16s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(8px)}}
.dhead{padding:12px var(--s3);border-bottom:var(--bw) solid var(--line-2);display:flex;gap:10px;align-items:flex-start}
.dhead h3{margin:4px 0 0;font-size:16px;line-height:1.35;flex:1;word-break:break-word;font-weight:700;letter-spacing:-.01em}
.dhead .st{margin-top:5px}
.dbody{flex:1;overflow-y:auto;padding:0 var(--s4) var(--s5)}
.dmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;color:var(--fg-2);margin:14px 0 0;word-break:break-all}
.dmeta dt{font:500 10.5px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.dmeta dd{margin:0;min-width:0}
.dsec{margin-top:22px}
.dsec>h4,.dsec>summary{margin:0 0 8px;font:600 10.5px/1 var(--mono);color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:var(--bw) solid var(--line)}
.dsec>summary{cursor:pointer;list-style:none}.dsec>summary::-webkit-details-marker{display:none}
.dsec>summary::before{content:"+";width:10px}.dsec[open]>summary::before{content:"−"}
.dsec>summary:hover{color:var(--fg)}
.dsec pre,.pre{white-space:pre-wrap;word-break:break-word;background:var(--surface);border:var(--bw) solid var(--line);padding:10px 12px;margin:0;font-size:12px;line-height:1.55}
.dsec>.md{font-size:13.5px;border-left:3px solid var(--fg);padding:2px 0 2px 14px}
#screen{max-height:320px;overflow:auto;font:11px/1.4 var(--mono);background:var(--term-bg);color:var(--term-fg);border-color:var(--term-bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.send textarea{width:100%;min-height:72px;border:var(--bw) solid var(--line);padding:10px 12px;background:var(--surface);resize:vertical;outline:0;display:block;transition:border-color var(--t),box-shadow var(--t)}
.send textarea:focus{border-color:var(--line-2);box-shadow:var(--hard)}
.send .acts{margin-top:8px;align-items:center}
.send .acts .hintk{font:11px var(--mono);color:var(--fg-3);flex:1}
.ev{font-size:12px;padding:6px 0;border-bottom:var(--bw) solid var(--line);word-break:break-word;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.ev:last-child{border-bottom:0}
.ev .k{font:600 11px/1.6 var(--mono);color:var(--fg)}.ev time{font:11px/1.6 var(--mono);color:var(--fg-3);white-space:nowrap}
.ev .x{grid-column:2;color:var(--fg-2)}
.icard{padding:14px var(--s4);border-bottom:var(--bw) solid var(--line)}
.icard .ctext{font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin:8px 0;font-weight:500}
.icard img{max-width:100%;max-height:150px;border:var(--bw) solid var(--line);cursor:zoom-in}
/* ---------- overlays ---------- */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--bg);border:var(--bw) solid var(--line-2);border-left:4px solid var(--fg);box-shadow:var(--hard);padding:10px 14px;font-size:13px;white-space:pre-wrap;word-break:break-word;animation:tin .16s ease-out;cursor:pointer}
.toast.warning,.toast.error{border-left-color:var(--acc)}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--bg);border:var(--bw) solid var(--line-2);box-shadow:8px 8px 0 var(--hard-c);width:min(540px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.dlg h3{margin:0;padding:14px 18px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-bottom:var(--bw) solid var(--line-2)}
.dlg .dc{padding:10px 18px;overflow:auto;flex:1}
.dlg .dc p{margin:6px 0}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:var(--bw) solid var(--line)}
.dlg .opt{display:block;width:100%;text-align:left;padding:9px 12px;border:var(--bw) solid transparent;border-bottom-color:var(--line);background:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.dlg .opt:hover,.dlg .opt:focus-visible{background:var(--inv-bg);color:var(--inv-fg);outline:0}
.dlg input,.dlg textarea{width:100%;padding:9px 12px;border:var(--bw) solid var(--line-2);background:var(--surface);outline:0}
.dlg input:focus,.dlg textarea:focus{box-shadow:var(--hard)}
.dlg textarea{min-height:240px;font-family:var(--mono);font-size:12.5px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh;border:var(--bw) solid #fff}
</style>
</head>
<body>
<header>
  <div class="brand"><i class="mk"></i><span class="bt">quick-agent</span></div>
  <div id="summary" aria-live="polite">…</div>
  <div class="grow"></div>
  <div id="mobtabs"><button class="btn" id="mobToggle">交接台</button></div>
  <button class="btn toggle" id="focusBtn" aria-pressed="false" title="专注：完成汇报先暂存，每 30 分钟一批呈现；只有在等你的事会出现">专注</button>
  <span class="chip hide-m" id="hubChip" title="hub 连接"><span class="dot" id="hubDot"></span><span id="hubText">hub</span></span>
  <button class="btn icon" id="themeBtn" title="主题">◐</button>
  <button class="btn icon" id="menuBtn" title="更多" aria-haspopup="true">⋯</button>
  <div class="menu" id="menu" role="menu">
    <button class="mi" data-m="history"><span class="lbl">回顾</span>全部任务</button>
    <button class="mi" data-m="comments"><span class="lbl">评论</span>浏览器评论</button>
    <label class="mi"><span class="lbl">模型</span><select id="modelSel"></select></label>
    <label class="mi"><span class="lbl">思考</span><select id="thinkSel"></select></label>
    <a class="mi" id="dashLink" target="_blank"><span class="lbl">hub</span>旧版任务面板 ↗</a>
    <a class="mi" id="extLink"><span class="lbl">插件</span>下载浏览器插件 ↓</a>
  </div>
</header>
<div id="main">
  <section id="attn" aria-label="注意力">
    <div class="scroll" id="board">
      <div class="sec need" id="secNeed"><div class="sh"><i class="mk"></i><span class="lbl">需要你</span><span class="n" id="nNeed"></span><span class="grow"></span><button class="act" id="snoozed"></button></div><div id="needList"></div></div>
      <div class="sec flight" id="secFlight"><div class="sh"><i class="mk"></i><span class="lbl">进行中 · 已托付</span><span class="n" id="nFlight"></span></div><div id="flightList"></div></div>
      <div class="sec skim" id="secSkim"><div class="sh"><i class="mk"></i><span class="lbl">已完成 · 待扫一眼</span><span class="n" id="nSkim"></span><span class="grow"></span><button class="act" id="skimAll">全部知道了</button></div><div id="held"></div><div id="skimList"></div></div>
      <div class="afoot"><button data-m="history">回顾全部任务</button><button data-m="comments">浏览器评论</button><span id="machines"></span></div>
    </div>
    <div class="layer" id="drawer"></div>
    <div class="layer" id="detail"></div>
  </section>
  <section id="desk" aria-label="交接台">
    <div class="deskhead"><span class="lbl">交接台</span><span class="chip" style="color:var(--fg-3)">把一件事交给前台，它会派给 worker 并给你回执</span></div>
    <div id="log"><div class="col"><button id="older" style="display:none"></button><div id="msgs"></div></div></div>
    <div id="composer"><div class="col">
      <div id="statusline"><span id="conn"><span class="dot"></span> 连接中…</span><span id="queue"></span><span id="ticker"></span><span id="cwd" style="color:var(--fg-3)"></span></div>
      <div class="box">
        <div id="thumbs"></div>
        <textarea id="input" rows="1" placeholder="把一件事交出去……说清要什么、在哪个项目，前台会派给 worker" aria-label="交出一件事"></textarea>
        <div class="row"><span class="hint" id="hint"></span>
          <button class="btn danger" id="stopBtn" style="display:none">■ 停</button>
          <button class="btn primary" id="sendBtn">交出去 ↵</button></div>
      </div>
    </div></div>
  </section>
</div>
<div id="toasts"></div>
<div id="zoom"><img alt=""></div>
<script>

"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const t=await r.text();let d;try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(r.status===401){location.reload();throw new Error('unauthorized')}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'刚刚':s<3600?Math.floor(s/60)+' 分钟前':s<86400?Math.floor(s/3600)+' 小时前':Math.floor(s/86400)+' 天前'};
const ST={starting:'启动中',running:'运行中',idle:'空闲',needs_input:'需要输入',blocked:'受阻',done:'完成',failed:'失败',cancelled:'已取消',exited:'已退出',pending:'待处理',claimed:'已认领',dispatched:'已派单',dismissed:'已忽略'};
const ACTIVE=['starting','running'],ATTN=['idle','needs_input','blocked','done','failed','exited'];
const stPill=s=>'<span class="st '+esc(s)+'">'+esc(ST[s]||s)+'</span>';

/* ---------- theme ---------- */
const root=document.documentElement;
const THEME_NAME={'':'跟随系统',light:'浅色',dark:'深色'},THEME_ICON={'':'◐',light:'○',dark:'●'};
function applyTheme(){const p=localStorage.qaTheme||'';const t=p||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;const b=$('#themeBtn');if(b){b.textContent=THEME_ICON[p]||'◐';b.title='主题：'+(THEME_NAME[p]||p)+'（点击切换）'}}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
// cycle: follow system → light → dark → follow system
$('#themeBtn').onclick=()=>{const p=localStorage.qaTheme||'';const n=p===''?'light':p==='light'?'dark':'';if(n)localStorage.qaTheme=n;else localStorage.removeItem('qaTheme');applyTheme();toast('主题：'+THEME_NAME[n],'info',1500)};

/* ---------- toasts / zoom / modal ---------- */
function toast(msg,level='info',ms=5000){const el=document.createElement('div');el.className='toast '+level;el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),ms);el.onclick=()=>el.remove()}
document.addEventListener('click',e=>{const img=e.target.closest('img.zoomable');if(img){$('#zoom img').src=img.src;$('#zoom').style.display='flex'}});
$('#zoom').onclick=()=>$('#zoom').style.display='none';
function modal(html,onMount,onClose){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="dlg">'+html+'</div>';document.body.append(m);const close=()=>{if(!m.isConnected)return;m.remove();onClose&&onClose()};m.addEventListener('mousedown',e=>{if(e.target===m)close()});m.addEventListener('keydown',e=>{if(e.key==='Escape')close()});onMount&&onMount(m.firstChild,close);return close}

/* ---------- markdown (small, escape-first) ---------- */
function inline(s){
  s=esc(s);
  const codes=[];s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');

// Interruption cost, highest first (docs/attention.md P2). Lower number = more urgent.
const NEED={needs_input:[1,'在等你回答',true],blocked:[2,'卡住了，需要你',true],failed:[3,'出错了，要你决定',false],exited:[4,'worker 退出了',false],idle:[5,'停下了，没有汇报',false]};

const snoozed=id=>snooze[id]&&snooze[id]>Date.now();
/** Is the front itself waiting on an answer from you? (last word is its question, and you haven't replied) */
function frontQuestion(){
  if(streaming)return null;
  for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];
    if(m.role==='user')return null;
    if(m.role==='assistant'){const tx=(m.content||[]).filter(b=>b?.type==='text').map(b=>b.text).join('\n').trim();if(!tx)return null;const tail=tx.slice(-120);return /[?？]\s*$|[?？][^。.\n]{0,30}$/.test(tail)?{text:tx,ts:m.timestamp}:null}
  }
  return null;
}
function classify(){
  const need=[],flight=[],skim=[],held=[];let hidden=0;
  for(const t of tasks.values()){
    if(ACTIVE.includes(t.status)){flight.push(t);continue}
    if(NEED[t.status]&&!t.closed){if(snoozed(t.id)){hidden++;continue}need.push({kind:'task',t,p:NEED[t.status][0]+(t.unread?0:.5),ts:t.updatedAt});continue}
    if(t.unread&&(t.status==='done'||t.status==='cancelled')){(focus.on&&t.updatedAt>focus.release?held:skim).push(t)}
  }
  for(const i of intakes.values()){
    const stale=Date.now()-i.createdAt;
    if(stale>86400e3||snoozed(i.id))continue;
    // nobody picked it up, or the front took it but has not handed it off for a while
    if((i.status==='pending'&&stale>20e3)||(i.status==='claimed'&&!i.taskId&&stale>10*60e3))need.push({kind:'intake',i,p:6,ts:i.createdAt});
  }
  const fq=frontQuestion();if(fq)need.push({kind:'front',q:fq,p:0,ts:fq.ts||Date.now()});
  need.sort((a,b)=>a.p-b.p||b.ts-a.ts);flight.sort((a,b)=>b.updatedAt-a.updatedAt);skim.sort((a,b)=>b.updatedAt-a.updatedAt);
  return {need,flight,skim,held,hidden};
}

    '<div class="dsec send"><h4>再交代一句</h4><textarea id="tmsg" placeholder="发给负责这件事的 worker；窗口关了会自动恢复它"></textarea><div class="acts"><span class="hintk">⌘/Ctrl+Enter 发送</span><button class="btn primary" data-a="send">发送</button></div></div>'+
    '<div class="dsec"><h4>实时终端 <span class="chip" id="scrState"></span></h4><pre id="screen" class="pre">…</pre></div>'+
    '<details class="dsec" id="briefSec"><summary>任务简报</summary><pre class="pre">'+esc(t.brief)+'</pre></details>'+
    '<div class="dsec"><h4>事件</h4>'+(ev.slice().reverse().map(e=>'<div class="ev"><time>'+new Date(e.ts).toLocaleString()+'</time><span class="k">'+esc(e.kind)+(e.status?' → '+esc(ST[e.status]||e.status):'')+'</span>'+(e.text?'<span class="x">'+esc(e.text.slice(0,600))+'</span>':'')+'</div>').join('')||'<div class="blank">暂无事件</div>')+'</div></div>';
  const ta=d.querySelector('#tmsg');ta.value=keep;if(briefOpen)d.querySelector('#briefSec').open=true;if(focusReply)setTimeout(()=>ta.focus());
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();d.querySelector('[data-a=send]').click()}};
  d.querySelector('[data-back]').onclick=closeTask;
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
    if(a==='close'&&!confirm('放下 '+t.id+'？会关闭它的 worker 窗口。'))return;
    if(a==='cancel'&&!confirm('中止 '+t.id+' 当前运行？'))return;
    try{if(a==='send'){const text=ta.value.trim();if(!text)return;await api('POST','/api/hub/tasks/'+t.id+'/message',{text});ta.value='';tick('已交代给 '+t.id)}
      else await api('POST','/api/hub/tasks/'+t.id+'/'+a,{});openTask(t.id)}catch(e){toast(e.message,'error')}});
  // Opening a needs-you item counts as having seen it; finished reports are cleared by "扫过".
  if(t.unread&&t.status!=='done')api('POST','/api/hub/tasks/'+t.id+'/ack',{}).catch(()=>{});
  pollScreen(t.id);
}
function closeTask(){selTask=null;detailSeq++;clearTimeout(screenTimer);const d=$('#detail');d.classList.remove('on');d.dataset.id='';if(location.hash.startsWith('#task='))history.replaceState(null,'',location.pathname)}
async function pollScreen(id){clearTimeout(screenTimer);if(selTask!==id)return;let r;try{r=await api('GET','/api/hub/tasks/'+encodeURIComponent(id)+'/screen')}catch{r={alive:false,text:''}}
  if(selTask!==id)return;const el=$('#screen');if(!el)return;const atB=el.scrollTop+el.clientHeight>=el.scrollHeight-8;
  el.textContent=r.alive?(r.text||'(空)'):'(worker 窗口已关闭)';$('#scrState').innerHTML=r.alive?'<span class="dot live"></span> LIVE':'';if(atB)el.scrollTop=el.scrollHeight;
  if(r.alive)screenTimer=setTimeout(()=>pollScreen(id),1500)}
let detailTimer=0;function refreshDetailSoon(){clearTimeout(detailTimer);detailTimer=setTimeout(()=>{if(selTask&&!document.activeElement?.closest?.('#detail'))openTask(selTask)},400)}

/* ---------- views (stable entry points for the desktop client) ---------- */
// v: "need" (需要你) | "inflight" (进行中) | "skim" (已完成待扫)
function qaShowView(v){closeTask();closeDrawer();showDesk(false);const el={need:'#secNeed',inflight:'#secFlight',skim:'#secSkim'}[v];if(!el)return;const s=$(el);s.scrollIntoView({block:'start',behavior:'smooth'});s.classList.remove('hl');void s.offsetWidth;s.classList.add('hl')}
window.openTask=openTask;window.qaShowView=qaShowView;
function fromHash(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('task'))openTask(h.get('task'));else if(h.get('view'))qaShowView(h.get('view'))}
window.addEventListener('hashchange',fromHash);
if(window.quickDesktop){try{quickDesktop.onOpenTask?.(id=>openTask(id));quickDesktop.onView?.(v=>qaShowView(v));quickDesktop.onAction?.(a=>{if(a==='focus-input'){showDesk(true);input.focus()}})}catch{}}

/* ---------- hub ---------- */
function renderMachines(){$('#machines').innerHTML=machines.length>1?machines.map(m=>'<span title="'+esc((m.description||'')+(m.hops>1?' · 经 '+m.via:''))+'"><span class="dot '+(m.online?'on':'off')+'"></span>'+esc(m.id)+'</span>').join(''):''}
function setHub(ok){hubOk=ok;$('#hubDot').className='dot '+(ok?'on':'off');$('#hubText').textContent=ok?'hub':'hub 离线'}
async function loadHub(){
  try{const [tr,mr,ir]=await Promise.all([api('GET','/api/hub/tasks'),api('GET','/api/hub/machines'),api('GET','/api/hub/intake')]);
    tasks.clear();for(const t of tr.tasks)tasks.set(t.id,t);selfId=mr.self||'';machines=mr.machines||[];intakes.clear();for(const i of ir.intake||[])intakes.set(i.id,i);
    const first=!hubLoaded;hubLoaded=true;renderMachines();renderBoard();for(let i=0;i<nodes.length;i++)renderMsg(i);if(first)fromHash();
  }catch(e){setHub(false);if(!hubLoaded)$('#needList').innerHTML='<div class="calmnote"><b>暂时连不上 hub。</b><br>'+esc(e.message)+'<br>运行 <code>quick hub start</code>，连上后会自动刷新。</div>'}
}
function onHub(e){
  if(e.type==='task'){const prev=tasks.get(e.task.id);tasks.set(e.task.id,e.task);renderBoard();if(e.task.id===selTask&&(e.event||prev?.status!==e.task.status))refreshDetailSoon();
    if(prev&&prev.status!==e.task.status){for(const [id,i] of toolOwner){const r=toolRes.get(id);if(r?.result?.details?.task?.id===e.task.id)schedule(i)}}}
  else if(e.type==='machines'){machines=e.machines;renderMachines()}
  else if(e.type==='intake'){intakes.set(e.intake.id,e.intake);renderBoard()}
}
setInterval(renderBoard,30e3); // ages, snooze expiry, "nobody picked it up" thresholds

/* ---------- stream ---------- */
function applyState(st){S=st;msgs=st.messages||[];base=Math.max(0,(st.messagesTotal||msgs.length)-msgs.length);streaming=!!st.isStreaming;cur=-1;renderAll();renderHeader();setStreaming();renderQueue(st.queue?.steering,st.queue?.followUp);setHub(!!st.hubConnected);for(const d of st.dialogs||[])showDialog(d);if(st.lastError)toast(st.lastError,'error');renderBoard()}
function connect(){
  const es=new EventSource('/api/stream');
  es.onopen=()=>{$('#conn').innerHTML='<span class="dot on"></span> 前台在线';loadHub()};
  es.onerror=()=>{$('#conn').innerHTML='<span class="dot off"></span> 重连中…'};
  es.onmessage=m=>{const e=JSON.parse(m.data);
    switch(e.type){
      case 'session':applyState(e.state);break;   // the (single) front stream was (re)loaded
      case 'agent':onAgent(e.event);break;
      case 'hub':onHub(e.event);break;
      case 'hub.state':setHub(e.connected);if(e.connected)loadHub();break;
      case 'ui.notify':if(e.level==='error')toast(e.message,'error');else if(!focus.on||e.level==='warning')tick(e.message);break;
      case 'ui.status':S.statuses=e.statuses;break;
      case 'ui.dialog':showDialog(e.dialog);break;
      case 'ui.dialog.close':{const c=openDialogs.get(e.id);if(c)c();break}
    }};
}
renderFocus();connect();input.focus();
</script>
