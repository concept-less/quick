<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quick-agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{
  --bg:#f7f7f8;--panel:#ffffff;--soft:#f0f1f4;--line:#e3e5ea;--fg:#1b1d22;--dim:#6b7180;--faint:#9aa0ad;
  --acc:#4f6df5;--acc-soft:#e8ecfe;--ok:#1f9d55;--ok-soft:#e3f5ea;--warn:#c27c0e;--warn-soft:#fdf3e1;--err:#d93c3c;--err-soft:#fde8e8;
  --user:#4f6df5;--user-fg:#fff;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0f1115;--panel:#16191f;--soft:#1d2129;--line:#2a2f3a;--fg:#e7e9ee;--dim:#9198a8;--faint:#666d7c;
  --acc:#7d95ff;--acc-soft:#232b48;--ok:#4cc38a;--ok-soft:#173326;--warn:#e5a94a;--warn-soft:#3a2d15;--err:#f2777a;--err-soft:#3d1c1e;
  --user:#3b55d9;--user-fg:#fff;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
/* header */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;min-height:50px}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand small{font-weight:500;color:var(--dim);font-size:12px}
.sess{display:flex;align-items:center;gap:4px;min-width:0;max-width:360px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--soft);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess:hover{border-color:var(--acc)}
.sess span{overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.icon{padding:5px 8px}
.btn:disabled{opacity:.5;cursor:default}
select.btn{padding-right:6px;max-width:200px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:0 0 auto}
.dot.on{background:var(--ok)}.dot.off{background:var(--err)}.dot.warn{background:var(--warn)}
/* layout */
#main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
#chat{display:flex;flex-direction:column;min-width:0;min-height:0}
#side{min-width:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
#mobtabs{display:none}
@media (max-width:900px){
  #main{grid-template-columns:minmax(0,1fr)}#side{border-left:0;display:none}
  body.show-side #side{display:flex}body.show-side #chat{display:none}
  #mobtabs{display:flex}.hide-m{display:none!important}
}
/* chat */
#log{flex:1;overflow-y:auto;padding:22px 0 10px;scroll-behavior:auto}
.col{max-width:820px;margin:0 auto;padding:0 20px}
.msg{margin:0 0 16px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.bubble{max-width:85%;padding:9px 14px;border-radius:16px 16px 4px 16px;background:var(--user);color:var(--user-fg);white-space:pre-wrap;word-break:break-word}
.bubble img{max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:6px}
.asst{max-width:100%;word-break:break-word}
.asst>.md{padding:2px 2px}
.md p{margin:.35em 0}.md ul,.md ol{margin:.35em 0;padding-left:1.4em}.md li{margin:.1em 0}
.md h1,.md h2,.md h3,.md h4{margin:.8em 0 .3em;line-height:1.3}.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}
.md code{background:var(--soft);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.md pre{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;margin:.5em 0}
.md pre code{background:none;border:0;padding:0}
.md blockquote{margin:.4em 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--dim)}
.md table{border-collapse:collapse;margin:.5em 0;font-size:13px}.md td,.md th{border:1px solid var(--line);padding:4px 8px}
.md a{word-break:break-all}
.tid{font-family:var(--mono);font-size:12px;padding:0 5px;border-radius:5px;background:var(--acc-soft);color:var(--acc);cursor:pointer;white-space:nowrap}
.tid:hover{text-decoration:underline}
.think{margin:4px 0;color:var(--dim);font-size:13px}
.think summary{cursor:pointer;list-style:none;user-select:none}.think summary::before{content:"▸ ";}.think[open] summary::before{content:"▾ "}
.think .body{white-space:pre-wrap;border-left:2px solid var(--line);padding:2px 10px;margin:4px 0 4px 3px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:6px 0;overflow:hidden;box-shadow:var(--shadow)}
.tool>summary{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;list-style:none;user-select:none;font-size:13px}
.tool>summary::-webkit-details-marker{display:none}
.tool .tname{font-weight:600}.tool .targs{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool .tres{border-top:1px solid var(--line);padding:8px 12px;background:var(--soft);max-height:360px;overflow:auto}
.tool .tres pre{margin:0;white-space:pre-wrap;word-break:break-word}
.tool.dispatch{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.tool.dispatch>summary{background:var(--acc-soft)}
.tool.err{border-color:color-mix(in srgb,var(--err) 50%,var(--line))}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ico{width:16px;text-align:center;flex:0 0 auto}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);padding:10px 14px;max-width:92%;align-self:stretch}
.card .chead{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:4px}
.card .chead b{color:var(--fg)}
.card.report{border-left:3px solid var(--acc)}
.card.report.done{border-left-color:var(--ok)}.card.report.needs_input,.card.report.blocked,.card.report.idle{border-left-color:var(--warn)}.card.report.failed,.card.report.exited,.card.report.cancelled{border-left-color:var(--err)}
.card.comment{border-left:3px solid #b05cf0}
.card .ctext{white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:220px;overflow:auto}
.card .ctext.md{white-space:normal}
.card img{max-width:260px;max-height:180px;border-radius:8px;margin:6px 6px 0 0;border:1px solid var(--line);cursor:zoom-in}
.note{color:var(--dim);font-size:12.5px;text-align:center;margin:10px 0}
.errline{color:var(--err);background:var(--err-soft);border-radius:8px;padding:6px 10px;font-size:13px;margin:4px 0;white-space:pre-wrap}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty{margin:14vh auto 0;text-align:center;color:var(--dim);max-width:520px}
.empty h2{color:var(--fg);font-size:20px;margin:0 0 6px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}.sugg button:hover{border-color:var(--acc);color:var(--acc)}
/* composer */
#composer{flex:0 0 auto;padding:6px 0 14px}
#statusline{font-size:12px;color:var(--dim);display:flex;gap:12px;align-items:center;min-height:20px;padding:0 4px 4px;flex-wrap:wrap}
#queue{font-size:12px;color:var(--warn)}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);padding:8px 8px 8px 14px;display:flex;flex-direction:column;gap:6px}
.box:focus-within{border-color:var(--acc)}
.box textarea{border:0;outline:0;resize:none;background:transparent;min-height:24px;max-height:240px;line-height:1.55;padding:4px 0;width:100%}
.box .row{display:flex;align-items:center;gap:8px}
.box .hint{font-size:11.5px;color:var(--faint);flex:1}
#thumbs{display:flex;gap:6px;flex-wrap:wrap}#thumbs:empty{display:none}
#thumbs div{position:relative}#thumbs img{height:54px;border-radius:6px;border:1px solid var(--line)}
#thumbs b{position:absolute;top:-6px;right:-6px;background:var(--fg);color:var(--bg);border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;cursor:pointer}
/* side panel */
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{padding:7px 12px;border:0;background:none;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;line-height:16px;text-align:center;margin-left:4px}
.badge:empty{display:none}
.filters{display:flex;gap:6px;padding:8px 12px;flex:0 0 auto;align-items:center;border-bottom:1px solid var(--line)}
.fchip{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--dim)}
.fchip.on{background:var(--acc-soft);color:var(--acc);border-color:transparent}
#machines{font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;min-height:0}
.titem{min-width:0;overflow:hidden;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.titem:hover{background:var(--soft)}.titem.sel{background:var(--acc-soft)}
.trow{display:flex;align-items:center;gap:7px;min-width:0}
.ttitle{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tago{font-size:11.5px;color:var(--faint);flex:0 0 auto}
.st{font-size:11px;padding:0 7px;border-radius:999px;background:var(--soft);color:var(--dim);white-space:nowrap;line-height:18px;flex:0 0 auto}
.st.running,.st.starting{background:var(--acc-soft);color:var(--acc)}.st.done{background:var(--ok-soft);color:var(--ok)}
.st.needs_input,.st.idle,.st.blocked{background:var(--warn-soft);color:var(--warn)}.st.failed,.st.exited,.st.cancelled{background:var(--err-soft);color:var(--err)}
.st.pending{background:var(--warn-soft);color:var(--warn)}.st.claimed{background:var(--acc-soft);color:var(--acc)}.st.dispatched{background:var(--ok-soft);color:var(--ok)}
.mach{font-size:11px;color:var(--acc);font-family:var(--mono)}
.udot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.blank{padding:30px 16px;color:var(--dim);text-align:center;font-size:13px}
/* detail */
#detail{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;z-index:5}
#detail.on{display:flex}
.dhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.dhead h3{margin:0;font-size:15px;line-height:1.4;flex:1;word-break:break-word}
.dbody{flex:1;overflow-y:auto;padding:4px 14px 20px}
.dmeta{font-size:12px;color:var(--dim);margin:8px 0;word-break:break-all}
.dsec{margin-top:14px}
.dsec>h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.dsec pre,.pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0;font-size:12.5px}
.dsec .md{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
#screen{max-height:300px;overflow:auto;font:11.5px/1.35 var(--mono);background:#0d0f13;color:#d8dbe2;border-color:#0d0f13}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.send textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);resize:vertical;outline:0}
.send textarea:focus{border-color:var(--acc)}
.ev{font-size:12px;padding:3px 0 3px 10px;border-left:2px solid var(--line);margin:2px 0;word-break:break-word}
.ev .k{color:var(--acc);font-weight:500}.ev time{color:var(--faint);margin-right:6px}
.icard{padding:10px 14px;border-bottom:1px solid var(--line)}
.icard .ctext{font-size:13px;white-space:pre-wrap;word-break:break-word;margin:4px 0}
.icard img{max-width:100%;max-height:150px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
/* overlays */
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:9px 12px;box-shadow:var(--shadow);font-size:13px;white-space:pre-wrap;word-break:break-word;animation:tin .18s ease-out}
.toast.warning{border-left-color:var(--warn)}.toast.error{border-left-color:var(--err)}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.dlg h3{margin:0;padding:14px 16px 6px;font-size:15px}
.dlg .dc{padding:6px 16px;overflow:auto;flex:1}
.dlg .df{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px}
.dlg .opt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap}
.dlg .opt:hover{background:var(--soft);border-color:var(--line)}
.dlg input,.dlg textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);outline:0}
.dlg textarea{min-height:240px;font-family:var(--mono);font-size:12.5px}
.sitem{padding:9px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sitem:hover{background:var(--soft)}.sitem.cur{border-color:var(--acc);background:var(--acc-soft)}
.sitem .s1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sitem .s2{font-size:12px;color:var(--dim)}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="brand">⚡ quick-agent <small class="hide-m">前台</small></div>
  <div class="sess" id="sessBtn" title="切换会话"><span id="sessName">…</span><span style="color:var(--faint)">▾</span></div>
  <button class="btn icon" id="newBtn" title="新会话">＋<span class="hide-m">新会话</span></button>
  <div class="grow"></div>
  <span class="chip hide-m" id="hubChip"><span class="dot" id="hubDot"></span><span id="hubText">hub</span></span>
  <select class="btn hide-m" id="modelSel" title="模型"></select>
  <select class="btn hide-m" id="thinkSel" title="思考级别" style="max-width:140px"></select>
  <div id="mobtabs"><button class="btn" id="mobToggle">任务</button></div>
  <button class="btn icon" id="themeBtn" title="切换深浅色">◐</button>
  <a class="btn icon hide-m" id="dashLink" target="_blank" title="hub 面板（旧版）">↗</a>
</header>
<div id="main">
  <section id="chat">
    <div id="log"><div class="col" id="msgs"></div></div>
    <div id="composer"><div class="col">
      <div id="statusline"><span id="conn"><span class="dot"></span> 连接中…</span><span id="extStatus"></span><span id="queue"></span><span class="grow"></span><span id="cwd" class="mono" style="font-size:11.5px;color:var(--faint)"></span></div>
      <div class="box">
        <div id="thumbs"></div>
        <textarea id="input" rows="1" placeholder="告诉前台 agent 你要做什么…（Enter 发送，Shift+Enter 换行，可粘贴图片）"></textarea>
        <div class="row"><span class="hint" id="hint">/tasks 任务列表 · /qa on|off · /name 会话名</span>
          <button class="btn danger" id="stopBtn" style="display:none">■ 停止</button>
          <button class="btn primary" id="sendBtn">发送</button></div>
      </div>
    </div></div>
  </section>
  <aside id="side">
    <div class="tabs"><button class="tab on" data-tab="tasks">任务<span class="badge" id="tBadge"></span></button><button class="tab" data-tab="intake">浏览器评论<span class="badge" id="iBadge"></span></button></div>
    <div id="pane-tasks" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="filters"><button class="fchip on" data-f="open">进行中/待处理</button><button class="fchip" data-f="all">全部</button><span class="grow"></span><span class="chip" id="tcount"></span></div>
      <div id="machines"></div>
      <div class="scroll" id="tlist"></div>
    </div>
    <div id="pane-intake" style="display:none;flex-direction:column;flex:1;min-height:0"><div class="scroll" id="ilist"></div></div>
    <div id="detail"></div>
  </aside>
</div>
<div id="toasts"></div>
<div id="zoom"><img alt=""></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined});const t=await r.text();let d;try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(r.status===401){location.reload();throw new Error('unauthorized')}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'刚刚':s<3600?Math.floor(s/60)+' 分钟前':s<86400?Math.floor(s/3600)+' 小时前':Math.floor(s/86400)+' 天前'};
const ST={starting:'启动中',running:'运行中',idle:'空闲',needs_input:'需要输入',blocked:'受阻',done:'完成',failed:'失败',cancelled:'已取消',exited:'已退出',pending:'待处理',claimed:'已认领',dispatched:'已派单',dismissed:'已忽略'};
const ACTIVE=['starting','running'],ATTN=['idle','needs_input','blocked','done','failed','exited'];
const stPill=s=>'<span class="st '+esc(s)+'">'+esc(ST[s]||s)+'</span>';

/* ---------- theme ---------- */
const root=document.documentElement;
function applyTheme(){const t=localStorage.qaTheme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t}
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
$('#themeBtn').onclick=()=>{localStorage.qaTheme=root.dataset.theme==='dark'?'light':'dark';applyTheme()};

/* ---------- toasts / zoom / modal ---------- */
function toast(msg,level='info',ms=5000){const el=document.createElement('div');el.className='toast '+level;el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),ms);el.onclick=()=>el.remove()}
document.addEventListener('click',e=>{const img=e.target.closest('img.zoomable');if(img){$('#zoom img').src=img.src;$('#zoom').style.display='flex'}});
$('#zoom').onclick=()=>$('#zoom').style.display='none';
function modal(html,onMount,onClose){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="dlg">'+html+'</div>';document.body.append(m);const close=()=>{if(!m.isConnected)return;m.remove();onClose&&onClose()};m.addEventListener('mousedown',e=>{if(e.target===m)close()});m.addEventListener('keydown',e=>{if(e.key==='Escape')close()});onMount&&onMount(m.firstChild,close);return close}

/* ---------- markdown (small, escape-first) ---------- */
function inline(s){
  s=esc(s);
  const codes=[];s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(（])(https?:\/\/[^\s<)）]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  s=linkTasks(s);
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>{const c=codes[+i];return tasks.has(c)?tidHtml(c):'<code>'+c+'</code>'});
}
function linkTasks(html){return html.replace(/(^|[^\w\/#.-])(t[0-9a-f]{4})(?![\w-])/g,(m,p,id)=>tasks.has(id)?p+tidHtml(id):m)}
const tidHtml=id=>'<span class="tid" data-task="'+esc(id)+'">'+esc(id)+'</span>';
function md(src){
  const lines=String(src??'').replace(/\r/g,'').split('\n');let out='',i=0;
  const isTable=k=>/^\s*\|.*\|\s*$/.test(lines[k]||'')&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[k+1]||'');
  while(i<lines.length){
    let l=lines[i];
    const fence=/^\s*(```|~~~)\s*([\w+-]*)/.exec(l);
    if(fence){const buf=[];i++;while(i<lines.length&&!lines[i].trim().startsWith(fence[1]))buf.push(lines[i++]);i++;out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';continue}
    if(!l.trim()){i++;continue}
    const h=/^(#{1,4})\s+(.*)$/.exec(l);if(h){out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';i++;continue}
    if(isTable(i)){const row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const head=row(lines[i]);i+=2;let t='<table><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>';while(i<lines.length&&/^\s*\|/.test(lines[i]))t+='<tr>'+row(lines[i++]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';out+=t+'</table>';continue}
    if(/^\s*>/.test(l)){const buf=[];while(i<lines.length&&/^\s*>/.test(lines[i]))buf.push(lines[i++].replace(/^\s*>\s?/,''));out+='<blockquote>'+md(buf.join('\n'))+'</blockquote>';continue}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      const ordered=/^\s*\d/.test(l);let items=[];
      while(i<lines.length&&(/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])||(/^\s{2,}\S/.test(lines[i])&&items.length))){
        if(/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])&&!/^\s{4,}/.test(lines[i]))items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,''));else items[items.length-1]+='\n'+lines[i].trim();i++}
      out+=(ordered?'<ol>':'<ul>')+items.map(x=>'<li>'+inline(x).replace(/\n/g,'<br>')+'</li>').join('')+(ordered?'</ol>':'</ul>');continue}
    const buf=[];while(i<lines.length&&lines[i].trim()&&!/^\s*(```|~~~|#{1,4}\s|>|[-*+]\s|\d+[.)]\s)/.test(lines[i])&&!isTable(i))buf.push(lines[i++]);
    if(!buf.length){buf.push(lines[i++])}
    out+='<p>'+buf.map(inline).join('<br>')+'</p>';
  }
  return out;
}

let S={};                 // session state from server
let msgs=[];              // agent messages (no system)
let nodes=[];             // DOM node per message

let toolOwner=new Map();  // toolCallId -> message index
let cur=-1;               // index of streaming message
let streaming=false;
const tasks=new Map(),intakes=new Map();let machines=[],selfId='',selTask=null,taskFilter='open',hubOk=false;

/* ---------- chat rendering ---------- */
const TOOL={qa_dispatch:['🚀','派单'],qa_tasks:['📋','查看任务'],qa_task_read:['📄','读取任务'],qa_task_send:['✉️','追加指令'],qa_task_cancel:['⊘','中止任务'],qa_machines:['🖥','机器'],qa_remote_fs:['🌐','远程文件'],read:['📖','读取'],grep:['🔎','搜索'],find:['🗂','查找'],ls:['📁','列目录'],bash:['⌨️','bash'],edit:['✏️','编辑'],write:['📝','写入']};
function argSummary(name,a){a=a||{};
  if(name==='qa_dispatch')return (a.title||'')+' · '+(a.machine?a.machine+':':'')+(a.cwd||'');
  if(name==='qa_task_send')return (a.id||'')+' · '+(a.message||'');
  if(name==='qa_task_read'||name==='qa_task_cancel')return a.id||'';
  if(name==='qa_remote_fs')return (a.machine||'')+' '+(a.op||'')+' '+(a.path||'')+(a.pattern?' /'+a.pattern+'/':'');
  if(name==='read'||name==='ls')return a.path||'.';
  if(name==='grep'||name==='find')return (a.pattern||'')+'  '+(a.path||'');
  if(name==='bash')return a.command||'';
  const s=JSON.stringify(a);return s==='{}'?'':s}
const textOf=c=>typeof c==='string'?c:(c||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
const imgsOf=c=>typeof c==='string'?[]:(c||[]).filter(b=>b.type==='image');
function toolHtml(b){
  const r=toolRes.get(b.id)||{};const [ic,label]=TOOL[b.name]||['🔧',b.name];
  const running=!r.result&&(r.running||streaming);
  let extra='';
  const task=r.result?.details?.task;
  if(b.name==='qa_dispatch'&&task){extra=' '+tidHtml(task.id)+' '+stPill((tasks.get(task.id)||task).status)}
  else if(task&&b.name!=='qa_dispatch')extra=' '+stPill((tasks.get(task.id)||task).status);
  const state=running?'<span class="spin"></span>':r.isError?'<span style="color:var(--err)">✗</span>':r.result?'<span style="color:var(--ok)">✓</span>':'';
  const res=r.result?'<div class="tres"><pre>'+linkTasks(esc(textOf(r.result.content)||'(无输出)'))+'</pre></div>':(b._partial?'<div class="tres"><pre>'+esc(b._partial)+'</pre></div>':'');
  const argsFull=b.name==='qa_dispatch'&&b.arguments?.brief?'<div class="tres"><b>简报</b><pre>'+esc(b.arguments.brief)+'</pre></div>':'';
  return '<details class="tool'+(b.name==='qa_dispatch'?' dispatch':'')+(r.isError?' err':'')+'"><summary><span class="ico">'+ic+'</span><span class="tname">'+esc(label)+'</span><span class="targs">'+esc(argSummary(b.name,b.arguments))+'</span>'+extra+state+'</summary>'+argsFull+res+'</details>';
}
function msgHtml(m){
  if(m.role==='user'){
    const t=textOf(m.content),imgs=imgsOf(m.content);
    const im=imgs.map(x=>'<img class="zoomable" src="data:'+esc(x.mimeType)+';base64,'+x.data+'">').join('');
    if(/^\[浏览器评论/.test(t)){
      const first=t.split('\n')[0];const cm=/^评论:\s*(.*)$/m.exec(t);const pg=/^页面:\s*(.*)$/m.exec(t);
      return '<div class="card comment"><div class="chead">🖱 <b>浏览器评论</b><span class="mono">'+esc(first.replace(/^\[浏览器评论\s*|\].*$/g,''))+'</span></div>'+(cm?'<div style="font-weight:600;margin-bottom:4px">'+esc(cm[1])+'</div>':'')+(pg?'<div class="chead">'+inline(pg[1])+'</div>':'')+'<details><summary class="chead" style="cursor:pointer">完整上下文</summary><div class="ctext">'+esc(t)+'</div></details>'+im+'</div>';
    }
    return '<div class="bubble">'+linkTasks(esc(t))+im+'</div>';
  }
  if(m.role==='assistant'){
    let h='';
    for(const b of m.content||[]){
      if(!b)continue;
      if(b.type==='text'&&b.text)h+='<div class="md">'+md(b.text)+'</div>';
      else if(b.type==='thinking'&&(b.thinking||'').trim())h+='<details class="think"'+(m===msgs[cur]&&streaming?' open':'')+'><summary>思考</summary><div class="body">'+esc(b.thinking)+'</div></details>';
      else if(b.type==='toolCall')h+=toolHtml(b);
    }
    if(m.stopReason==='error'&&m.errorMessage)h+='<div class="errline">⚠ '+esc(m.errorMessage)+'</div>';
    if(m.stopReason==='aborted')h+='<div class="note">— 已中止 —</div>';
    return h?'<div class="asst">'+h+'</div>':'';
  }
  if(m.role==='custom'){
    if(m.display===false)return '';
    const t=textOf(m.content),d=m.details||{};
    if(m.customType==='qa-report'){
      const body=t.replace(/^\[quick-agent 汇报\][^\n]*\n?/,'');const head=(t.split('\n')[0]||'').replace(/^\[quick-agent 汇报\]\s*/,'');
      return '<div class="card report '+esc(d.status||'')+'"><div class="chead">📮 <b>quick-agent 汇报</b>'+(d.taskId?tidHtml(d.taskId):'')+(d.status?stPill(d.status):'')+'</div><div style="font-weight:600;margin-bottom:2px">'+esc(head.replace(/^\S+\s+/,''))+'</div><div class="ctext md">'+md(body)+'</div></div>';
    }
    return '<div class="card"><div class="chead">🧩 <b>'+esc(m.customType||'消息')+'</b></div><div class="ctext">'+linkTasks(esc(t))+'</div></div>';
  }
  if(m.role==='compactionSummary')return '<div class="note">— 上下文已压缩 —</div>';
  if(m.role==='branchSummary')return '<div class="note">— 分支摘要 —</div>';
  if(m.role==='bashExecution')return '<div class="card"><div class="chead">⌨️ <b>'+esc(m.command)+'</b></div><pre class="pre">'+esc(m.output)+'</pre></div>';
  return '';
}
function indexTools(i){const m=msgs[i];if(m?.role==='assistant')for(const b of m.content||[])if(b?.type==='toolCall')toolOwner.set(b.id,i);if(m?.role==='toolResult'){const r=toolRes.get(m.toolCallId)||{};r.result={content:m.content,details:m.details};r.isError=m.isError;r.running=false;toolRes.set(m.toolCallId,r)}}
function nearBottom(){const l=$('#log');return l.scrollTop+l.clientHeight>=l.scrollHeight-80}
function scrollDown(force){const l=$('#log');if(force||stick)l.scrollTop=l.scrollHeight}
let stick=true;$('#log').addEventListener('scroll',()=>{stick=nearBottom()});
function renderAll(){
  toolRes=new Map();toolOwner=new Map();msgs.forEach((_,i)=>indexTools(i));
  const box=$('#msgs');box.innerHTML='';nodes=[];
  if(!msgs.length){box.innerHTML='<div class="empty"><h2>⚡ 我是前台 agent</h2><div>告诉我要做什么，我会快速理解、组装上下文，然后派给独立的 worker 去完成。<br>右侧可以实时查看所有任务。</div><div class="sugg"><button>派一个测试任务：在 /tmp 下创建 hello.txt</button><button>现在有哪些任务在跑？</button><button>mesh 里有哪些机器？</button></div></div>';
    box.querySelectorAll('.sugg button').forEach(b=>b.onclick=()=>{$('#input').value=b.textContent;$('#input').focus();autosize()});}
  for(const m of msgs){const el=document.createElement('div');el.className='msg '+m.role;el.innerHTML=msgHtml(m);box.append(el);nodes.push(el)}
  renderTyping();scrollDown(true);
}
function renderMsg(i){const el=nodes[i];if(el)el.innerHTML=msgHtml(msgs[i])}
let typingEl=null;
function renderTyping(){const need=streaming&&!(cur>=0&&msgs[cur]?.role==='assistant'&&(msgs[cur].content||[]).length);if(need&&!typingEl){typingEl=document.createElement('div');typingEl.className='msg';typingEl.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';$('#msgs').append(typingEl)}else if(!need&&typingEl){typingEl.remove();typingEl=null}else if(need&&typingEl)$('#msgs').append(typingEl)}
let raf=0;const dirty=new Set();
function schedule(i){dirty.add(i);if(raf)return;raf=requestAnimationFrame(()=>{raf=0;for(const k of dirty)renderMsg(k);dirty.clear();renderTyping();scrollDown()})}
function pushMsg(m){if(!msgs.length)$('#msgs').innerHTML='';msgs.push(m);const el=document.createElement('div');el.className='msg '+m.role;$('#msgs').append(el);nodes.push(el);indexTools(msgs.length-1);el.innerHTML=msgHtml(m);return msgs.length-1}
function onAgent(e){
  switch(e.type){
    case 'agent_start':streaming=true;setStreaming();renderTyping();break;
    case 'agent_settled':streaming=false;cur=-1;setStreaming();renderTyping();for(let i=Math.max(0,nodes.length-6);i<nodes.length;i++)renderMsg(i);break;
    case 'message_start':{const m=structuredClone(e.message);if(m.role==='assistant')m.content=m.content||[];cur=pushMsg(m);renderTyping();scrollDown();break}
    case 'message_update':{const m=msgs[cur];if(!m||m.role!=='assistant')break;const a=e.assistantMessageEvent,c=m.content,ci=a.contentIndex;
      if(a.type==='text_start')c[ci]={type:'text',text:''};
      else if(a.type==='text_delta'){c[ci]=c[ci]||{type:'text',text:''};c[ci].text+=a.delta}
      else if(a.type==='text_end'&&typeof a.content==='string')c[ci]={type:'text',text:a.content};
      else if(a.type==='thinking_start')c[ci]={type:'thinking',thinking:''};
      else if(a.type==='thinking_delta'){c[ci]=c[ci]||{type:'thinking',thinking:''};c[ci].thinking+=a.delta}
      else if(a.type==='thinking_end'&&typeof a.content==='string')c[ci]={type:'thinking',thinking:a.content};
      else if(a.type==='toolcall_start')c[ci]={type:'toolCall',id:a.id,name:a.toolName,arguments:{},_partial:''};
      else if(a.type==='toolcall_delta'){if(c[ci]){c[ci]._partial+=a.delta;try{c[ci].arguments=JSON.parse(c[ci]._partial)}catch{}}}
      else if(a.type==='toolcall_end'&&a.toolCall){c[ci]=a.toolCall;toolOwner.set(a.toolCall.id,cur)}
      schedule(cur);break}
    case 'message_end':{if(cur>=0&&msgs[cur]&&msgs[cur].role===e.message.role){msgs[cur]=e.message;indexTools(cur);schedule(cur)}else{cur=pushMsg(e.message)}
      if(e.message.role==='toolResult'){const o=toolOwner.get(e.message.toolCallId);if(o!=null)schedule(o)}
      cur=-1;break}
    case 'tool_execution_start':{const r=toolRes.get(e.toolCallId)||{};r.running=true;toolRes.set(e.toolCallId,r);const o=toolOwner.get(e.toolCallId);if(o!=null)schedule(o);break}
    case 'tool_execution_end':{const r=toolRes.get(e.toolCallId)||{};r.running=false;r.result=e.result;r.isError=e.isError;toolRes.set(e.toolCallId,r);const t=e.result?.details?.task;if(t){tasks.set(t.id,{...(tasks.get(t.id)||{}),...t});renderTasks()}const o=toolOwner.get(e.toolCallId);if(o!=null)schedule(o);break}
    case 'queue_update':renderQueue(e.steering,e.followUp);break;
    case 'auto_retry_start':toast('请求失败，'+Math.round(e.delayMs/1000)+' 秒后重试（'+e.attempt+'/'+e.maxAttempts+'）：'+e.errorMessage,'warning');break;
    case 'compaction_start':toast('正在压缩上下文…');break;
    case 'session_info_changed':S.sessionName=e.name;renderHeader();break;
  }
}
function renderQueue(st,fu){const n=(st||[]).length+(fu||[]).length;$('#queue').textContent=n?'⏳ 排队中 '+n+' 条（当前回复结束后处理）':''}
function setStreaming(){$('#stopBtn').style.display=streaming?'':'none';$('#sendBtn').textContent=streaming?'排队发送':'发送';$('#hint').textContent=streaming?'回复中：Enter 排队到本轮之后，Alt+Enter 插入到当前轮（steer）':'/tasks 任务列表 · /qa on|off · /name 会话名'}

function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,240)+'px'}
input.addEventListener('input',autosize);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(e.altKey?'steer':'followUp')}});
input.addEventListener('paste',e=>{for(const it of e.clipboardData?.items||[]){if(it.type.startsWith('image/')){e.preventDefault();const f=it.getAsFile();const r=new FileReader();r.onload=()=>{const [h,d]=String(r.result).split(',');pending.push({mimeType:h.slice(5,h.indexOf(';')),data:d});renderThumbs()};r.readAsDataURL(f)}}});

const openDialogs=new Map();
function showDialog(d){
  if(openDialogs.has(d.id))return;
  const reply=v=>api('POST','/api/dialog',{id:d.id,value:v}).catch(()=>{});
  let body='';
  if(d.kind==='select')body=d.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o)+'</button>').join('');
  else if(d.kind==='confirm')body='<p>'+esc(d.message||'')+'</p>';
  else if(d.kind==='input')body='<input placeholder="'+esc(d.placeholder||'')+'">';
  else body='<textarea>'+esc(d.prefill||'')+'</textarea>';
  const foot=d.kind==='select'?'<button class="btn" data-x>取消</button>':'<button class="btn" data-x>取消</button><button class="btn primary" data-ok>确定</button>';
  let answered=false;
  const done=v=>{if(answered)return;answered=true;reply(v)};
  const close=modal('<h3>'+esc(d.title)+'</h3><div class="dc">'+body+'</div><div class="df">'+foot+'</div>',(dlg,c)=>{
    const pick=v=>{done(v);c()};
    dlg.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(d.options[+b.dataset.i]));
    dlg.querySelector('[data-x]').onclick=()=>pick(d.kind==='confirm'?false:undefined);
    const ok=dlg.querySelector('[data-ok]');const f=dlg.querySelector('input,textarea');
    if(ok)ok.onclick=()=>pick(d.kind==='confirm'?true:f.value);
    if(f){setTimeout(()=>f.focus());if(f.tagName==='INPUT')f.onkeydown=e=>{if(e.key==='Enter')ok.click()}}
  },()=>{openDialogs.delete(d.id);done(d.kind==='confirm'?false:undefined)});
  // closed by the server (answered elsewhere / timeout): no reply
  openDialogs.set(d.id,()=>{answered=true;close()});
}

/* ---------- tasks panel ---------- */
function renderMachines(){$('#machines').innerHTML=machines.map(m=>'<span title="'+esc((m.description||'')+(m.hops>1?' · 经 '+m.via:''))+'"><span class="dot '+(m.online?'on':'off')+'"></span> '+esc(m.id)+(m.self?'（本机）':'')+(m.activeTasks?' · '+m.activeTasks:'')+'</span>').join('')||'<span>单机模式</span>'}
const mtag=t=>t.machine&&t.machine!==selfId?'<span class="mach">@'+esc(t.machine)+'</span>':'';
let tRaf=0;function renderTasks(){if(tRaf)return;tRaf=requestAnimationFrame(()=>{tRaf=0;_renderTasks()})}
function _renderTasks(){
  const all=[...tasks.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const list=taskFilter==='all'?all:all.filter(t=>ACTIVE.includes(t.status)||t.unread||(!t.closed&&Date.now()-t.updatedAt<86400e3));
  $('#tlist').innerHTML=list.map(t=>{const detail=ACTIVE.includes(t.status)?t.activity:t.summary;return '<div class="titem'+(t.id===selTask?' sel':'')+'" data-id="'+esc(t.id)+'"><div class="trow">'+(t.unread?'<span class="udot"></span>':'')+'<span class="ttitle">'+esc(t.title)+'</span>'+stPill(t.status)+'</div><div class="trow" style="margin-top:2px"><span class="mono" style="color:var(--faint);font-size:11.5px">'+esc(t.id)+'</span>'+mtag(t)+'<span class="tsub">'+esc((detail||t.cwd||'').split('\n')[0])+'</span><span class="tago">'+ago(t.updatedAt)+'</span></div></div>'}).join('')||'<div class="blank">'+(taskFilter==='all'?'还没有任务':'没有进行中或待处理的任务')+'</div>';
  $('#tlist').querySelectorAll('.titem').forEach(el=>el.onclick=()=>openTask(el.dataset.id));
  const act=all.filter(t=>ACTIVE.includes(t.status)).length,un=all.filter(t=>t.unread).length;
  $('#tcount').textContent=act+' 运行中 · '+all.length+' 总计';$('#tBadge').textContent=un||'';
}
document.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.f;document.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x===b));renderTasks()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('#pane-tasks').style.display=b.dataset.tab==='tasks'?'flex':'none';$('#pane-intake').style.display=b.dataset.tab==='intake'?'flex':'none';closeTask()});
let screenTimer=0,detailSeq=0;
async function openTask(id){
  if(innerWidth<=900&&!document.body.classList.contains('show-side'))$('#mobToggle').click();
  selTask=id;renderTasks();const seq=++detailSeq;const d=$('#detail');d.classList.add('on');
  if(!d.dataset.id||d.dataset.id!==id)d.innerHTML='<div class="blank">加载中…</div>';d.dataset.id=id;
  let r;try{r=await api('GET','/api/hub/tasks/'+encodeURIComponent(id)+'?events=100')}catch(e){if(seq===detailSeq)d.innerHTML='<div class="dhead"><button class="btn icon" data-back>←</button><h3>'+esc(id)+'</h3></div><div class="blank">'+esc(e.message)+'</div>';d.querySelector('[data-back]').onclick=closeTask;return}
  if(seq!==detailSeq)return;
  const t=r.task,ev=r.events||[];tasks.set(t.id,t);
  const keep=d.querySelector('#tmsg')?.value||'';const briefOpen=d.querySelector('#briefSec')?.open;
  d.innerHTML='<div class="dhead"><button class="btn icon" data-back title="返回">←</button><h3>'+esc(t.title)+'</h3>'+stPill(t.status)+'</div><div class="dbody">'+
    '<div class="dmeta"><span class="mono">'+esc(t.id)+'</span> · 机器 '+esc(t.machine||selfId)+' · <span class="mono">'+esc(t.cwd)+'</span><br>来源 '+esc(t.source?.kind||'-')+(t.source?.url?' · <a href="'+esc(t.source.url)+'" target="_blank">'+esc(t.source.url)+'</a>':'')+' · 更新于 '+ago(t.updatedAt)+(t.activity&&ACTIVE.includes(t.status)?'<br>当前: '+esc(t.activity):'')+'</div>'+
    '<div class="acts"><button class="btn" data-a="ack"'+(t.unread?'':' disabled')+'>✓ 标记已读</button><button class="btn danger" data-a="cancel"'+(ACTIVE.includes(t.status)?'':' disabled')+'>⊘ 中止</button><button class="btn danger" data-a="close"'+(t.closed?' disabled':'')+'>✕ 关闭窗口</button></div>'+
    (t.summary?'<div class="dsec"><h4>最新汇报</h4><div class="md">'+md(t.summary)+'</div></div>':'')+
    '<div class="dsec send"><h4>追加指令</h4><textarea id="tmsg" placeholder="发给负责这个任务的 worker（⌘/Ctrl+Enter 发送）；窗口已关闭会自动恢复会话"></textarea><div class="acts"><button class="btn primary" data-a="send">发送</button></div></div>'+
    '<div class="dsec"><h4>实时终端 <span class="chip" id="scrState"></span></h4><pre id="screen" class="pre">…</pre></div>'+
    '<details class="dsec" id="briefSec"><summary style="cursor:pointer;font-size:12px;color:var(--dim);font-weight:600">任务简报</summary><pre class="pre" style="margin-top:6px">'+esc(t.brief)+'</pre></details>'+
    '<div class="dsec"><h4>事件</h4>'+ev.slice().reverse().map(e=>'<div class="ev"><time>'+new Date(e.ts).toLocaleString()+'</time><span class="k">'+esc(e.kind)+(e.status?' → '+esc(ST[e.status]||e.status):'')+'</span> '+esc((e.text||'').slice(0,600))+'</div>').join('')+'</div></div>';
  const ta=d.querySelector('#tmsg');ta.value=keep;if(briefOpen)d.querySelector('#briefSec').open=true;
  ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();d.querySelector('[data-a=send]').click()}};
  d.querySelector('[data-back]').onclick=closeTask;
  d.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;
    if(a==='close'&&!confirm('关闭 '+t.id+' 的 worker 窗口？'))return;
    if(a==='cancel'&&!confirm('中止 '+t.id+' 当前运行？'))return;
    try{if(a==='send'){const text=ta.value.trim();if(!text)return;await api('POST','/api/hub/tasks/'+t.id+'/message',{text});ta.value='';toast('已发送给 '+t.id)}
      else await api('POST','/api/hub/tasks/'+t.id+'/'+a,{});openTask(t.id)}catch(e){toast(e.message,'error')}});
  if(t.unread)api('POST','/api/hub/tasks/'+t.id+'/ack',{}).catch(()=>{});
  pollScreen(t.id);
}
function closeTask(){selTask=null;detailSeq++;clearTimeout(screenTimer);const d=$('#detail');d.classList.remove('on');d.dataset.id='';renderTasks()}
async function pollScreen(id){clearTimeout(screenTimer);if(selTask!==id)return;let r;try{r=await api('GET','/api/hub/tasks/'+encodeURIComponent(id)+'/screen')}catch{r={alive:false,text:''}}
  if(selTask!==id)return;const el=$('#screen');if(!el)return;const atB=el.scrollTop+el.clientHeight>=el.scrollHeight-8;
  el.textContent=r.alive?(r.text||'(空)'):'(worker 窗口已关闭)';$('#scrState').innerHTML=r.alive?'<span class="dot on"></span> 实时':'';if(atB)el.scrollTop=el.scrollHeight;
  if(r.alive)screenTimer=setTimeout(()=>pollScreen(id),1500)}
let detailTimer=0;function refreshDetailSoon(){clearTimeout(detailTimer);detailTimer=setTimeout(()=>{if(selTask&&!document.activeElement?.closest?.('#detail'))openTask(selTask)},400)}

/* ---------- browser comments ---------- */
function renderIntakes(){
  const list=[...intakes.values()].sort((a,b)=>b.createdAt-a.createdAt).slice(0,100);
  $('#ilist').innerHTML=list.map(i=>'<div class="icard"><div class="trow">'+stPill(i.status)+'<span class="tsub">'+esc(i.title||i.url||'')+'</span><span class="tago">'+ago(i.createdAt)+'</span></div><div class="ctext">'+esc(i.comment)+'</div>'+(i.url?'<div class="tsub"><a href="'+esc(i.url)+'" target="_blank">'+esc(i.url)+'</a></div>':'')+
    '<div class="trow" style="margin-top:4px"><span class="mono" style="color:var(--faint);font-size:11.5px">'+esc(i.id)+'</span>'+(i.machine&&i.machine!==selfId?'<span class="mach">@'+esc(i.machine)+'</span>':'')+(i.elements?.length?'<span class="tsub">'+i.elements.length+' 个元素 · '+esc(i.elements[0].selector||'')+'</span>':'<span class="grow"></span>')+(i.taskId?tidHtml(i.taskId):'')+'</div>'+
    (i.screenshots?.length&&(!i.machine||i.machine===selfId)?'<div style="margin-top:6px"><img class="zoomable" loading="lazy" src="/api/hub/intake/'+encodeURIComponent(i.id)+'/screenshot?n='+(i.screenshots.length>1?1:0)+'"></div>':'')+'</div>').join('')||'<div class="blank">还没有浏览器评论。<br>安装浏览器插件后，在网页上按 Alt+Shift+C 框选元素写评论，评论会交给前台 agent 处理。<br><br><a href="'+esc((S.hub||'')+'/extension.zip')+'">下载浏览器插件</a></div>';
  $('#iBadge').textContent=list.filter(i=>i.status==='pending').length||'';
}

/* ---------- hub ---------- */
function setHub(ok){hubOk=ok;$('#hubDot').className='dot '+(ok?'on':'off');$('#hubText').textContent=ok?'hub 已连接':'hub 离线'}
async function loadHub(){
  try{const [tr,mr,ir]=await Promise.all([api('GET','/api/hub/tasks'),api('GET','/api/hub/machines'),api('GET','/api/hub/intake')]);
    tasks.clear();for(const t of tr.tasks)tasks.set(t.id,t);selfId=mr.self||'';machines=mr.machines||[];intakes.clear();for(const i of ir.intake||[])intakes.set(i.id,i);
    renderMachines();renderTasks();renderIntakes();for(let i=0;i<nodes.length;i++)renderMsg(i);
  }catch(e){setHub(false)}
}
function onHub(e){
  if(e.type==='task'){const prev=tasks.get(e.task.id);tasks.set(e.task.id,e.task);renderTasks();if(e.task.id===selTask&&(e.event||prev?.status!==e.task.status))refreshDetailSoon();
    if(prev&&prev.status!==e.task.status){for(const [id,i] of toolOwner){const r=toolRes.get(id);if(r?.result?.details?.task?.id===e.task.id)schedule(i)}}}
  else if(e.type==='machines'){machines=e.machines;renderMachines()}
  else if(e.type==='intake'){const isNew=!intakes.has(e.intake.id);intakes.set(e.intake.id,e.intake);renderIntakes();if(isNew&&e.intake.status==='pending')toast('🖱 新的浏览器评论：'+e.intake.comment.slice(0,80))}
}

/* ---------- stream ---------- */
function applyState(st){S=st;msgs=st.messages||[];streaming=!!st.isStreaming;cur=-1;renderAll();renderHeader();setStreaming();renderQueue(st.queue?.steering,st.queue?.followUp);setHub(!!st.hubConnected);for(const d of st.dialogs||[])showDialog(d);if(st.lastError)toast(st.lastError,'error')}
function connect(){
  const es=new EventSource('/api/stream');
  es.onopen=()=>{$('#conn').innerHTML='<span class="dot on"></span> 已连接';loadHub();loadModels()};
  es.onerror=()=>{$('#conn').innerHTML='<span class="dot off"></span> 连接断开，重连中…'};
  es.onmessage=m=>{const e=JSON.parse(m.data);
    switch(e.type){
      case 'session':applyState(e.state);break;
      case 'agent':onAgent(e.event);break;
      case 'hub':onHub(e.event);break;
      case 'hub.state':setHub(e.connected);if(e.connected)loadHub();break;
      case 'ui.notify':toast(e.message,e.level);break;
      case 'ui.status':S.statuses=e.statuses;renderHeader();break;
      case 'ui.widgets':S.widgets=e.widgets;break;
      case 'ui.title':break;
      case 'ui.dialog':showDialog(e.dialog);break;
      case 'ui.dialog.close':{const c=openDialogs.get(e.id);if(c)c();break}
    }};
}
connect();setInterval(renderTasks,60000);input.focus();
</script>
