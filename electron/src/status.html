<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>quick-agent</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f0;--fg:#0d0d0d;--dim:#55554f;--acc:#0d0d0d;--line:#d4d4cc;--err:#e61919;--soft:#ebebe6}
@media (prefers-color-scheme: dark){:root{--bg:#0e0e0e;--fg:#ececE6;--dim:#a3a39c;--acc:#ececE6;--line:#2a2a2a;--err:#ff3b30;--soft:#161616}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,system-ui,"PingFang SC",sans-serif;display:grid;place-items:center}
.c{max-width:560px;padding:32px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--dim);white-space:pre-wrap;margin:6px 0}
.err{color:var(--err)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
button{margin-top:16px;padding:7px 16px;border-radius:0;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font:inherit;cursor:pointer}
code{font:12.5px ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 6px;border-radius:5px;user-select:all}
</style>
</head>
<body>
<div class="c">
  <h1>⚡ quick-agent</h1>
  <div id="spin" class="spin"></div>
  <p id="m"></p>
  <div id="more"></div>
</div>
<script>
"use strict";
const q=new URLSearchParams(location.search);const kind=q.get('kind')||'loading';
const m=document.getElementById('m');m.textContent=q.get('message')||'';
if(kind==='error'){
  document.getElementById('spin').remove();m.className='err';
  const more=document.getElementById('more');
  const p=document.createElement('p');p.innerHTML='日志：<code></code><br>也可以在终端运行 <code>quick ui status</code> / <code>quick hub status</code> 排查。';p.querySelector('code').textContent=q.get('log')||'~/.quick-agent/ui.log';more.append(p);
  const b=document.createElement('button');b.textContent='重试';b.onclick=()=>{b.disabled=true;b.textContent='重试中…';window.quickDesktop&&window.quickDesktop.retry()};more.append(b);
}
</script>
</body>
</html>
