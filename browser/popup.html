<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>quick-agent</title>
<style>
/* same tokens as ui/app.html (minimal brutalism: paper/ink + one signal-red accent) */
:root{
	--bg:#f4f4f0;--bg-2:#ebebe6;--surface:#fbfbf9;--fg:#0d0d0d;--fg-2:#55554f;--fg-3:#8c8c85;
	--line:#d4d4cc;--line-2:#0d0d0d;--acc:#e61919;--acc-fg:#fff;--inv-bg:#0d0d0d;--inv-fg:#f4f4f0;--hard-c:#0d0d0d;
	--sans:"Inter","Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
	--mono:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
	color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
	--bg:#0e0e0e;--bg-2:#161616;--surface:#121212;--fg:#ececE6;--fg-2:#a3a39c;--fg-3:#6b6b66;
	--line:#2a2a2a;--line-2:#ececE6;--acc:#ff3b30;--acc-fg:#0e0e0e;--inv-bg:#ececE6;--inv-fg:#0e0e0e;--hard-c:#4a4a46;
	color-scheme:dark;
}}
*{box-sizing:border-box}
body{width:340px;margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
:focus{outline:none}:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
h1{margin:0;height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line-2);font:800 13px/1 var(--sans);letter-spacing:-.01em;text-transform:uppercase}
h1 .mk{width:12px;height:12px;background:var(--acc);display:inline-block}
h1 .dot{margin-left:auto;width:8px;height:8px;background:var(--fg-3)}
h1 .dot.ok{background:var(--fg)}h1 .dot.err{background:var(--acc)}
main{padding:14px}
label{display:block;font:500 10.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:12px 0 5px}
label code{text-transform:none;letter-spacing:0;color:var(--fg-2)}
input[type=text],input[type=password],input:not([type]){width:100%;height:32px;padding:0 10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:0;font:12px var(--mono);transition:border-color .12s,box-shadow .12s}
input[type=text]:focus,input[type=password]:focus{border-color:var(--line-2);box-shadow:3px 3px 0 var(--hard-c);outline:none}
.row{display:flex;gap:6px;margin-top:12px}
button{flex:1;height:32px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:0;padding:0 10px;cursor:pointer;font:inherit;transition:border-color .12s,background .12s,color .12s}
button:hover{border-color:var(--line-2)}
button:active{transform:translate(1px,1px)}
button.primary{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);font-weight:600;padding:0 14px}
button.primary::after{content:"→";font-family:var(--mono)}
button.primary:hover{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
button:disabled{opacity:.4;cursor:default}
#status{margin-top:12px;padding:8px 10px;border:1px solid var(--line);border-left-width:3px;font-size:12px;color:var(--fg-2);min-height:16px;white-space:pre-wrap}
#status:empty{display:none}
#status.ok{border-left-color:var(--fg);color:var(--fg)}#status.err{border-left-color:var(--acc);color:var(--acc)}
#pickErr{color:var(--acc);font-size:12px;margin-top:8px;display:none;border:1px solid var(--acc);padding:6px 10px}
.hint{color:var(--fg-2);font-size:12px;margin-top:12px;line-height:1.7}
.hint a{color:var(--fg);cursor:pointer;text-decoration:underline;text-decoration-color:var(--fg-3);text-underline-offset:2px}.hint a:hover{color:var(--acc)}
kbd{font:500 10.5px/1 var(--mono);border:1px solid var(--line);border-bottom-width:2px;padding:1px 4px;color:var(--fg);background:var(--surface)}
details{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
summary{cursor:pointer;list-style:none;font:600 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:14px}details[open] summary::before{content:"−"}
summary:hover{color:var(--fg)}
.check{display:flex;gap:8px;align-items:flex-start;margin-top:12px;color:var(--fg-2);font:12px/1.5 var(--sans);text-transform:none;letter-spacing:0}
.check input{margin-top:3px;accent-color:var(--fg)}
.foot{border-top:1px solid var(--line);padding:8px 14px;color:var(--fg-3);font:10.5px/1.5 var(--mono)}
</style></head><body>
<h1><i class="mk"></i>quick-agent <i class="dot" id="dot" title="hub 连接状态"></i></h1>
<main>
<button class="primary" id="pick">在当前页面框选评论</button>
<div id="pickErr"></div>
<div class="hint">快捷键 <span id="shortcut"><kbd>…</kbd></span>（<a id="shortcuts">修改快捷键</a>，即 chrome://extensions/shortcuts）。<br>点击元素即可评论，Shift+点击多选，「框选区域」可拖出矩形，Esc 退出。</div>
<div id="status"></div>
<details id="settings">
	<summary>连接设置</summary>
	<label for="hubUrl">Hub 地址（本机 hub 或 ssh -L 转发的端口）</label><input id="hubUrl" type="text" placeholder="http://127.0.0.1:7788">
	<label for="token">Token（在 hub 所在机器运行 <code>quick token</code>）</label><input id="token" type="password" autocomplete="off">
	<div class="row"><button id="save">保存并测试</button><button id="dash">打开任务面板</button></div>
	<label class="check"><input type="checkbox" id="auto"> <span>在所有网站自动显示评论角标、从页面加载起记录控制台错误（需额外授予“所有网站”权限，可随时关闭）</span></label>
</details>
</main>
<div class="foot">数据只发送到你配置的 hub，不经过任何第三方服务器。</div>
<script src="popup.js"></script>
</body></html>
